[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "khers"
version = "0.1.1"
description = "A professional game engine for python; built on top of Panda3D"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "hojat72elect"}
]
dependencies = [
    "panda3d>=1.10.15",
    "panda3d-gltf>=1.3.0",
    "pillow>=12.0.0",
    "pyperclip>=1.11.0",
    "screeninfo>=0.8.1",
    "numpy>=2.5.2",
    "psd-tools>=1.19.0",
    "psutil>=7.2.2",
    "thumbhash>=0.1.2",
    "ursinanetworking>=2.1.5",
]

[project.urls]
Homepage = "https://github.com/hojat72elect/Khers_Engine"
Repository = "https://github.com/hojat72elect/Khers_Engine"

[tool.hatch.build.targets.wheel]
packages = ["src/ursina"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "sphinx>=9.1.0",
]


[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
ignore = ["I001"]
